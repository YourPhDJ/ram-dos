  }

    min-height:100vh;
    position:relative;
  }

  .eye{
    width:clamp(84px, 11vw, 124px); height:auto; color:var(--ink); margin-bottom:1rem;

    transform-origin:50% 44%;
    animation:eye-blink 6s ease-in-out infinite;
  }
  .eye .outline{fill:none; stroke:currentColor; stroke-width:3;}
  .eye .iris{fill:none; stroke:currentColor; stroke-width:2.5;}
  .eye .pupil{fill:currentColor;}
  .eye .rays line{stroke:currentColor; stroke-width:2; opacity:0.6;}
  @keyframes eye-blink{
    0%, 92%, 100%{ transform:scaleY(1); }
    94%{ transform:scaleY(0.06); }
    96%{ transform:scaleY(1); }
  }

  h1{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(2.1rem, 6vw, 3.4rem);

    letter-spacing:0.02em;

    font-family:'VT323', monospace;

    border-radius:2px;

    text-align:left;
  }

  .search-bar:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .btn-flat{
    font-family:'Space Mono', monospace;

    text-transform:uppercase;

  .btn-flat:active{ transform:translateY(1px); }

  .btn-flat:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-flat:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .output{
    width:100%; max-width:600px;
    min-height:2.4rem;
    display:flex; align-items:center; justify-content:center;
    padding:0 0.5rem;
  }

  @keyframes flash{from{opacity:0.25;}to{opacity:1;}}
  .output.flash p{animation:flash 0.25s ease-out;}

  .footer-mini{ text-align:center; max-width:44ch; }
  .about-toggle{

    return idx;
  }
